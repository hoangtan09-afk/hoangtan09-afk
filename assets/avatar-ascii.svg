    x="210.0"
    y="26"
    text-anchor="middle"
    font-family="Consolas, Courier New, monospace"
    font-size="10"
    fill="#8b949e"
>
hoangtan09-afk@github: ~ $ ./portrait.sh
</text>

<style>

.ascii {
    font-family: Consolas, "Courier New", monospace;
    font-size: 10px;
    fill: #c9d1d9;
    white-space: pre;
}

.line {
    opacity: 0;
    animation: appear 0.15s forwards;
}

@keyframes appear {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

</style>

